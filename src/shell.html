<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Prompt Builder</title>
<!--INJECT:STYLES-->
</head>
<body>
<header class="apb-header">
  <h1>AI Prompt Builder</h1>
  <span class="apb-version"><!--INJECT:VERSION--></span>
</header>

<main class="apb-main">
  <label class="apb-label" for="apb-brief">What are you trying to do?</label>
  <textarea id="apb-brief" rows="6" spellcheck="true"
    placeholder="I need a blog post about choosing a plumber, friendly tone, for homeowners"></textarea>

  <p class="apb-kindrow" id="apb-kindrow" hidden>
    <label for="apb-kind">Looks like:</label>
    <select id="apb-kind"></select>
  </p>

  <section class="apb-output" aria-label="Your prompt">
    <div class="apb-output-head">
      <h2>Your prompt</h2>
      <button type="button" id="apb-copy" disabled>Copy</button>
    </div>
    <p class="apb-muted" id="apb-empty"></p>
    <pre class="apb-prompt" id="apb-prompt" tabindex="0"></pre>
    <div class="apb-nudges" id="apb-nudges"></div>
  </section>
</main>

<!--INJECT:SCRIPT-->
</body>
</html>
