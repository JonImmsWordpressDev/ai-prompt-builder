name: Deploy to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow one deploy at a time, and let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the single-file tool
        run: npm run build

      - name: Serve it as index.html
        run: |
          mkdir -p _site
          cp dist/prompt-builder.html _site/index.html
          # Stop Jekyll touching the output; there is nothing here to process.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
